spring:
  datasource:
    url: jdbc:mysql://localhost:3306/credit_card_app
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  main:
    allow-circular-references: true

logging:
  file:
    path: .

server:
  port: 8081
  ssl:
    enabled: true
    key-store: classpath:mk.jks
    key-store-type: PKCS12
    key-alias: my_ssl_key
    key-store-password: Password@1